services:
  - type: web
    name: cuet-connectx-api
    runtime: node
    region: oregon
    plan: free
    branch: main
    rootDir: cuet-connectx-backend
    buildCommand: npm install
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: CORS_ORIGIN
        sync: false
